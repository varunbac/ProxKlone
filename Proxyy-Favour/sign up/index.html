<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Favour | Sign In</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="/auth.css?v=2">
    </head>
    <body>
        <section>
            <div class="container">
                <div id="scene">
                <div class="Layer" data-depth-x="-0.5" data-depth-y="-0.25"><img src="moon.png"></div>
                <div class="Layer" data-depth-x="0.15"><img src="mountains01.png"></div>
                <div class="Layer" data-depth-x="0.25"><img src="mountains02.png"></div>
                <div class="Layer" data-depth-x="-0.25"><img src="road.png"></div>
                </div>
            </div>
            <form class="login" id="loginForm">
                <h2>Sign In</h2>
                <div class="inputbox">
                    <input type="email" name="email" autocomplete="email" placeholder="Campus email" required>
                </div>
                <div class="inputbox">
                    <input type="password" name="password" autocomplete="current-password" placeholder="Password" required>
                </div>
                <div class="inputbox">
                    <input type="submit" value="Login" id="btn">
                </div>
            <div class="group">
                <a href="#" id="forgotPassword">Forgot Password</a>
                <a href="/signup.html">Signup</a>
            </div>
            <div class="auth-message" id="loginMessage" aria-live="polite"></div>
            </form>
        </section>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/parallax/3.1.0/parallax.min.js" integrity="sha512-/6TZODGjYL7M8qb7P6SflJB/nTGE79ed1RfJk3dfm/Ib6JwCT4+tOfrrseEHhxkIhwG8jCl+io6eaiWLS/UX1w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script>
            let scene = document.getElementById('scene');
            let parallax = new Parallax(scene);
        </script>
        <script src="/auth.js"></script>
    </body>
</html>
