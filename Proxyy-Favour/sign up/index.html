<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Hangout | Sign In</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="/auth.css?v=3">
    </head>
    <body>
        <section>
            <div class="container">
                <div id="scene">
                <div class="Layer" data-depth-x="-0.5" data-depth-y="-0.25"><img src="moon.png"></div>
                <div class="Layer" data-depth-x="0.15"><img src="mountains01.png"></div>
                <div class="Layer" data-depth-x="0.25"><img src="mountains02.png"></div>
                <div class="Layer" data-depth-x="-0.25"><img src="road.png"></div>
                </div>
            </div>
            <form class="login" id="loginForm">
                <h2>Sign In</h2>
                <div class="inputbox">
                    <input type="email" name="email" autocomplete="email" placeholder="Campus email" required>
                </div>
                <div class="inputbox">
                    <input type="password" name="password" autocomplete="current-password" placeholder="Password" required>
                </div>
                <div class="inputbox">
                    <input type="submit" value="Login" id="btn">
                </div>
            <div class="group">
                <a href="#" id="forgotPassword">Forgot Password</a>
                <a href="/signup.html">Signup</a>
            </div>
            <div class="auth-message" id="loginMessage" aria-live="polite"></div>
            </form>
            <form class="login" id="resetForm" hidden>
                <h2>Reset Password</h2>
                <p class="auth-help">We’ll send a six-digit reset code to your email.</p>
                <div class="inputbox"><input type="email" id="resetEmail" autocomplete="email" placeholder="Campus email" required></div>
                <div id="resetCodeFields" hidden>
                    <div class="inputbox"><input type="text" id="resetCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit email code" disabled></div>
                    <div class="inputbox"><input type="password" id="resetNewPassword" autocomplete="new-password" minlength="8" maxlength="1024" placeholder="New password (8 characters minimum)" disabled></div>
                </div>
                <div class="inputbox"><input type="submit" value="Send reset code" id="resetSubmit"></div>
                <div class="group auth-step-actions"><a href="#" id="backToLogin">Back to sign in</a><a href="#" id="resendResetCode" hidden>Resend code</a></div>
                <div class="auth-message" id="resetMessage" aria-live="polite"></div>
            </form>
        </section>
        <script>
            window.initHangoutParallax = function () {
                const scene = document.getElementById('scene');
                if (window.Parallax && scene) new window.Parallax(scene);
            };
        </script>
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/parallax/3.1.0/parallax.min.js" integrity="sha512-/6TZODGjYL7M8qb7P6SflJB/nTGE79ed1RfJk3dfm/Ib6JwCT4+tOfrrseEHhxkIhwG8jCl+io6eaiWLS/UX1w==" crossorigin="anonymous" referrerpolicy="no-referrer" onload="window.initHangoutParallax()"></script>
        <script src="/auth.js?v=3"></script>
    </body>
</html>
